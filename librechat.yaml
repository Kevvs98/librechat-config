version: 1.3.16
cache: true

# MCP de GoHighLevel, alcanzado por la red privada de Railway (mismo proyecto).
# El token NO va aquí: LibreChat lo toma de la variable de entorno CRM_MCP_TOKEN.
mcpServers:
  crm:
    type: streamable-http
    url: http://go-high-level-mcp-2026-complete.railway.internal:8000/mcp
    headers:
      Authorization: "Bearer ${CRM_MCP_TOKEN}"
    timeout: 60000
    # false: no inyectar las "instructions" del servidor MCP al modelo. Traen una recomendación
    # de afiliado a RealWave que no debe llegar a tu cliente. Las reglas viven en agent-instructions.md.
    serverInstructions: false
